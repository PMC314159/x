<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ACCESS GRANTED</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #050505;
      color: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Pretendard,
        "Noto Sans KR",
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.07), transparent 34%),
        #050505;
    }

    .card {
      width: min(430px, 100%);
      padding: 42px 30px 32px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      background: rgba(255,255,255,.035);
      box-shadow: 0 30px 80px rgba(0,0,0,.42);
      text-align: center;
    }

    .status {
      margin: 0 0 18px;
      color: rgba(255,255,255,.42);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .25em;
    }

    .welcome {
      margin: 0 0 25px;
      color: rgba(255,255,255,.55);
      font-size: 13px;
      line-height: 1.6;
    }

    .handle {
      min-height: 52px;
      display: grid;
      place-items: center;
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 800;
      letter-spacing: -.045em;
      word-break: break-all;
    }

    .loading {
      color: rgba(255,255,255,.35);
      font-size: 14px;
      font-weight: 500;
    }

    .open {
      width: 100%;
      min-height: 52px;
      margin-top: 28px;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #f4f4f4;
      color: #050505;
      text-decoration: none;
      font-size: 14px;
      font-weight: 780;
    }

    .logout {
      display: inline-block;
      margin-top: 20px;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.35);
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    .error {
      color: #ffb4b4;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main class="card">
    <p class="status">ACCESS GRANTED</p>

    <p class="welcome" id="welcome">
      인증 정보를 확인하고 있습니다.
    </p>

    <div class="handle" id="handle">
      <span class="loading">LOADING...</span>
    </div>

    <a class="open" id="openLink" href="#" target="_blank" rel="noopener">
      X에서 계정 열기 →
    </a>

    <button class="logout" id="logoutButton" type="button">
      로그아웃
    </button>
  </main>

  <script>
    async function loadSecret() {
      try {
        const response = await fetch("/api/secret", {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store"
        });

        if (response.status === 401) {
          location.replace("/");
          return;
        }

        if (!response.ok) {
          throw new Error("secret request failed");
        }

        const data = await response.json();

        document.getElementById("welcome").textContent =
          data.viewer
            ? `@${data.viewer} 계정으로 인증되었습니다.`
            : "X 계정 인증이 완료되었습니다.";

        const handle = String(data.handle || "").trim();

        document.getElementById("handle").textContent = handle;

        const username = handle.replace(/^@/, "");

        if (username) {
          const link = document.getElementById("openLink");
          link.href = `https://x.com/${encodeURIComponent(username)}`;
          link.style.display = "inline-flex";
        }
      } catch (error) {
        document.getElementById("welcome").textContent = "";
        document.getElementById("handle").innerHTML =
          '<span class="error">아이디를 불러오지 못했습니다.</span>';
      }
    }

    document
      .getElementById("logoutButton")
      .addEventListener("click", async () => {
        await fetch("/api/logout", {
          method: "POST",
          credentials: "same-origin"
        });

        location.replace("/");
      });

    loadSecret();
  </script>
</body>
</html>
