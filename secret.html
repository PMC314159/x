<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ACCESS GRANTED</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%; background: #ffffff; color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Pretendard, "Noto Sans KR", Arial, sans-serif;
    }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at 50% 0%, rgba(0,0,0,.035), transparent 34%), #ffffff;
    }
    .card {
      width: min(430px, 100%); padding: 42px 30px 32px;
      border: 1px solid rgba(0,0,0,.10); border-radius: 24px;
      background: rgba(255,255,255,.98); text-align: center;
    }
    .status {
      margin: 0 0 18px; color: rgba(0,0,0,.42);
      font-size: 10px; font-weight: 800; letter-spacing: .25em;
    }
    .welcome {
      margin: 0 0 25px; color: rgba(0,0,0,.55);
      font-size: 13px; line-height: 1.6;
    }
    .handle {
      min-height: 52px; display: grid; place-items: center;
      font-size: clamp(28px, 8vw, 42px); font-weight: 800;
      letter-spacing: -.045em; word-break: break-all;
    }
    .loading { color: rgba(0,0,0,.35); font-size: 14px; }
    .open {
      width: 100%; min-height: 52px; margin-top: 28px;
      display: none; align-items: center; justify-content: center;
      border-radius: 999px; background: #111111; color: #ffffff;
      text-decoration: none; font-size: 14px; font-weight: 780;
    }
    .logout {
      display: inline-block; margin-top: 20px; border: 0;
      background: transparent; color: rgba(0,0,0,.35);
      font: inherit; font-size: 11px; cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="status">ACCESS GRANTED</p>
    <p class="welcome" id="welcome">인증 정보를 확인하고 있습니다.</p>
    <div class="handle" id="handle"><span class="loading">LOADING...</span></div>
    <a class="open" id="openLink" href="#" target="_blank" rel="noopener">X에서 계정 열기 →</a>
    <button class="logout" id="logoutButton" type="button">로그아웃</button>
  </main>
  <script>
    async function loadSecret() {
      const response = await fetch("/api/secret", {
        credentials: "same-origin", cache: "no-store"
      });

      if (response.status === 401) {
        location.replace("/");
        return;
      }

      const data = await response.json();
      document.getElementById("welcome").textContent =
        data.viewer ? `@${data.viewer} 계정으로 인증되었습니다.` : "X 계정 인증이 완료되었습니다.";

      const handle = String(data.handle || "").trim();
      document.getElementById("handle").textContent = handle;

      const username = handle.replace(/^@/, "");
      if (username) {
        const link = document.getElementById("openLink");
        link.href = `https://x.com/${encodeURIComponent(username)}`;
        link.style.display = "inline-flex";
      }
    }

    document.getElementById("logoutButton").addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST", credentials: "same-origin" });
      location.replace("/");
    });

    loadSecret().catch(() => {
      location.replace("/");
    });
  </script>
</body>
</html>
