<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PRIVATE ACCESS</title>
  <style>
    :root { color-scheme: light; }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #ffffff;
      color: #111111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Pretendard,
        "Noto Sans KR",
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(0,0,0,.035), transparent 34%),
        #ffffff;
    }

    .card {
      width: min(430px, 100%);
      padding: 40px 30px 32px;
      border: 1px solid rgba(0,0,0,.10);
      border-radius: 24px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 24px 70px rgba(0,0,0,.08);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: rgba(0,0,0,.42);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .25em;
    }

    h1 {
      margin: 0;
      color: #111111;
      font-size: clamp(30px, 7vw, 43px);
      line-height: 1.05;
      letter-spacing: -.045em;
    }

    .description {
      margin: 18px auto 28px;
      max-width: 320px;
      color: rgba(0,0,0,.58);
      font-size: 14px;
      line-height: 1.75;
    }

    .login {
      width: 100%;
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 20px;
      border-radius: 999px;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 780;
      transition: transform .15s ease, opacity .15s ease;
    }

    .login:hover {
      transform: translateY(-1px);
    }

    .login:active {
      transform: translateY(0);
      opacity: .85;
    }

    .note {
      margin: 18px 0 0;
      color: rgba(0,0,0,.32);
      font-size: 11px;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">PRIVATE ACCESS</p>
    <h1>비공개 계정</h1>
    <p class="description">
      X 계정 인증이 완료된 사용자에게만
      새로운 계정 아이디를 표시합니다.
    </p>
    <a class="login" href="/api/login">
      <span style="font-size:20px">𝕏</span>
      X로 로그인
    </a>
    <p class="note">
      인증은 X의 공식 승인 페이지에서 진행됩니다.
    </p>
  </main>
</body>
</html>
