<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PRIVATE LINK</title>

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #050505;
      color: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Pretendard,
        "Noto Sans KR",
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.07), transparent 34%),
        #050505;
    }

    .card {
      width: min(430px, 100%);
      padding: 38px 30px 32px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      background: rgba(255,255,255,.035);
      box-shadow: 0 30px 80px rgba(0,0,0,.42);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: rgba(255,255,255,.45);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .24em;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 44px);
      line-height: 1.05;
      letter-spacing: -.04em;
    }

    .description {
      margin: 18px auto 28px;
      max-width: 320px;
      color: rgba(255,255,255,.62);
      font-size: 14px;
      line-height: 1.7;
    }

    .login-button {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 54px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: #f4f4f4;
      color: #050505;
      font: inherit;
      font-size: 15px;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
      transition:
        transform .15s ease,
        opacity .15s ease;
    }

    .login-button:hover {
      transform: translateY(-1px);
    }

    .login-button:active {
      transform: translateY(0);
      opacity: .85;
    }

    .x-mark {
      font-size: 20px;
      line-height: 1;
      font-weight: 700;
    }

    .note {
      margin: 18px 0 0;
      color: rgba(255,255,255,.35);
      font-size: 11px;
      line-height: 1.55;
    }
  </style>
</head>

<body>
  <main class="card">
    <p class="eyebrow">PRIVATE ACCESS</p>

    <h1>비공개 링크</h1>

    <p class="description">
      X 계정 인증이 완료된 사용자에게만
      다음 페이지를 표시합니다.
    </p>

    <a class="login-button" href="/api/login">
      <span class="x-mark">𝕏</span>
      X로 로그인
    </a>

    <p class="note">
      로그인은 X의 공식 인증 페이지에서 진행됩니다.
    </p>
  </main>
</body>
</html>
